services:
  server:
    build: .
    ports:
      - "2567:2567"
    volumes:
      # Match event logs stay on the laptop.
      - ./logs:/app/logs
    environment:
      # Local time for log file names. Node needs the zone by name (it has its own zone data);
      # change this if the laptop moves to another time zone.
      TZ: Asia/Kolkata
    restart: unless-stopped
