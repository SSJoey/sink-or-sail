<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Sink or Sail</title>
    <style>
      body { margin: 0; padding: 16px; font: 18px/1.4 sans-serif; background: #1d4f91; color: #fff; }
      input, button { font: inherit; padding: 8px 12px; margin: 4px 0; }
      button { min-width: 44px; min-height: 44px; }
      [hidden] { display: none !important; }
      #seats button { display: block; width: 100%; max-width: 320px; text-align: left; }
      #code { font-size: 40px; letter-spacing: 6px; font-weight: bold; }
      .error { color: #ffd166; min-height: 1.4em; }
      #game-screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: #0b2545; }
      #hud { display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 48px; flex: none; font-weight: bold; }
      #hud-energy { flex: 1; max-width: 360px; height: 16px; border: 2px solid #fff; border-radius: 4px; overflow: hidden; }
      #hud-energy-fill { height: 100%; width: 100%; background: #7ee081; }
      #game { flex: 1; min-height: 0; }
      #hud-clock { margin-left: auto; font-variant-numeric: tabular-nums; }
      #game-screen, #game-screen * { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      html, body { overscroll-behavior: none; }
      #touch { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; }
      #stick-base, #stick-knob { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; }
      #stick-base { width: 120px; height: 120px; border: 3px solid rgba(255,255,255,0.35); }
      #stick-base.held { border-color: rgba(255,255,255,0.7); }
      #stick-knob { width: 56px; height: 56px; background: rgba(255,255,255,0.45); }
      .touch-btn { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.15); color: #fff; font: bold 18px sans-serif; padding: 0; }
      .touch-btn.held { background: rgba(255,255,255,0.5); }
      #btn-boost { width: 120px; height: 120px; right: 40px; bottom: 40px; }
      #btn-fire { width: 110px; height: 110px; right: 40px; bottom: 40px; }
      #btn-shield { width: 80px; height: 80px; right: 170px; bottom: 55px; }
      /* Small Pack button above Boost / Fire; dim unless this role can use what's loaded. */
      #btn-pack { width: 76px; height: 76px; right: 57px; bottom: 175px; font-size: 14px; border-radius: 12px; opacity: 0.4; }
      #btn-pack.lit { opacity: 1; background: rgba(255,209,102,0.35); border-color: #ffd166; }
      #hud-pack { white-space: nowrap; }
      /* Host's mode buttons: the chosen one is highlighted. */
      .mode-btn[aria-pressed="true"] { background: #ffd166; color: #0b2545; font-weight: bold; }
      #hud-emp { color: #7fd8ff; white-space: nowrap; }
      /* EMP'd crew: every button dim (the stick still steers). */
      #touch.emp .touch-btn { opacity: 0.25; }
      .overlay-text { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.6); text-align: center; }
      #countdown { top: 35%; font-size: 96px; font-weight: bold; }
      #banner { top: 64px; font-size: 22px; font-weight: bold; background: rgba(11,37,69,0.85); padding: 8px 16px; border-radius: 8px; }
      #scoreboard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(11,37,69,0.95); padding: 16px 24px; border-radius: 12px; text-align: center; min-width: 280px; }
      #scoreboard h2 { margin: 0 0 8px; }
      #paused { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(11,37,69,0.95); padding: 16px 24px; border-radius: 12px; text-align: center; min-width: 280px; }
      #hud button { padding: 4px 12px; min-height: 36px; }
      #rotate { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b2545; font-size: 24px; text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <h1>Sink or Sail</h1>

    <section id="join-screen">
      <label>Your name <input id="name" maxlength="24" autocomplete="nickname" /></label>
      <p><button id="create">Create room</button></p>
      <p>
        <label>Room code <input id="code-input" maxlength="8" autocapitalize="characters" autocomplete="off" /></label>
        <button id="join">Join</button>
      </p>
    </section>

    <section id="room-screen" hidden>
      <p>Room code <span id="code"></span></p>
      <p id="status"></p>
      <div id="seats"></div>
      <p><button id="leave-seat" hidden>Leave seat</button></p>
      <p>Not seated: <span id="unseated"></span></p>
      <div id="last-result" hidden></div>
      <p>
        <label id="packs-host" hidden><input type="checkbox" id="packs-toggle" /> Packs on</label>
        <span id="packs-status"></span>
      </p>
      <p id="mode-host" hidden>
        <button id="mode-sinkCount" class="mode-btn" aria-pressed="true">Sink Count</button>
        <button id="mode-lastAfloat" class="mode-btn" aria-pressed="false">Last Afloat</button>
        <label id="lives-host" hidden>Lives <select id="lives-select"></select></label>
      </p>
      <p id="mode-status"></p>
      <p><button id="start">Start match</button> <span id="match"></span></p>
      <p><button id="leave">Leave room</button></p>
    </section>

    <p id="error" class="error" role="alert"></p>

    <section id="game-screen" hidden>
      <div id="hud">
        <span id="hud-role"></span>
        <span id="hud-crew"></span>
        <div id="hud-energy" title="Shared energy"><div id="hud-energy-fill"></div></div>
        <span id="hud-pack"></span>
        <span id="hud-emp"></span>
        <span id="hud-score"></span>
        <span id="hud-clock"></span>
        <button id="hud-pause" hidden>Pause</button>
        <button id="hud-exit" hidden>Exit</button>
      </div>
      <div id="game"></div>
      <div id="touch" hidden>
        <div id="stick-base"></div>
        <div id="stick-knob"></div>
        <button id="btn-boost" class="touch-btn" data-button="boost" hidden>Boost</button>
        <button id="btn-shield" class="touch-btn" data-button="shield" hidden>Shield</button>
        <button id="btn-fire" class="touch-btn" data-button="fire" hidden>Fire</button>
        <button id="btn-pack" class="touch-btn" data-button="pack" hidden>Pack</button>
      </div>
      <div id="countdown" class="overlay-text" hidden></div>
      <div id="banner" class="overlay-text" hidden></div>
      <div id="scoreboard" hidden>
        <div id="result"></div>
        <button id="back-to-room">Back to room</button>
      </div>
      <div id="paused" hidden>
        <p id="paused-text"></p>
        <div id="paused-host">
          <button id="resume">Resume</button>
          <button id="paused-exit">Exit game</button>
        </div>
      </div>
      <div id="rotate" hidden>Rotate your phone sideways to play</div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
